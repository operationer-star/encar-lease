name: Encar HEV 승계 감시 (주간 수집)

# 2026-11-04: GitHub 러너(해외 IP)에서는 엔카 API가 404를 반환해 수집 불가 → 주간 수집은 PC 작업 스케줄러(scripts/windows)로 이전.
# 이 워크플로는 수동 실행(workflow_dispatch) 전용으로 남겨 둠 (엔카 차단이 풀리는지 확인용).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encar-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 수집·페이지·보고 생성
        env:
          ENCAR_Q: ${{ vars.ENCAR_Q }}   # 비워두면 스크립트가 후보 q 를 자동 시도
        run: node scripts/collect.mjs

      - name: 커밋·푸시
        run: |
          git config user.name  "encar-bot"
          git config user.email "encar-bot@users.noreply.github.com"
          git add watch.html watch_data.json watch_history.json report.json report.md
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "watch: $(TZ=Asia/Seoul date +%F) 주간 수집"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 보고 요약 (Actions 화면용)
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true
