<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>엔카 승계 효율계산</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--paper:#fff;--fg:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#1d6ef0;--accent-soft:#e8f0fe;--good:#0a7d3b;--good-soft:#e7f6ec;--bad:#b91c1c;--bad-soft:#fde8e8;--warn:#92400e;--warn-soft:#fef3c7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--fg);font-size:13.5px;line-height:1.5}
.wrap{max-width:1500px;margin:0 auto;padding:16px 14px 70px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
#mktTabs a{display:inline-block}
.bar{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.bar label{font-size:12px;color:#475569;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.bar input[type=number],.bar input[type=text],.bar select{padding:6px 8px;border:1px solid #d8dde3;border-radius:7px;font-size:13px;font-family:inherit;background:#fff}
.bar input[type=number]{width:74px;text-align:right}
.stat{margin-left:auto;font-size:12px;color:var(--muted)}
.stat b{color:var(--fg)}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:1280px}
th,td{padding:7px 8px;border-bottom:1px solid #f0f1f3;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#f1f5f9;color:#475569;font-weight:600;font-size:11.5px;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
td.l.car{white-space:normal;min-width:230px;max-width:320px;line-height:1.3}
th.on{color:var(--accent)}
tbody tr:hover{background:#f8fafc}
tbody tr.sel{background:var(--accent-soft)}
tbody tr.fav{background:#fffbea}
button.fav{background:none;border:none;cursor:pointer;font-size:17px;color:#cbd5e1;padding:0 4px;line-height:1}
button.fav.on{color:#f5b301}
button.fav:hover{color:#f5b301}
tbody tr.r1 td:first-child{box-shadow:inset 4px 0 0 #ef4444}
tbody tr.r2 td:first-child{box-shadow:inset 4px 0 0 #f97316}
tbody tr.r3 td:first-child{box-shadow:inset 4px 0 0 #eab308}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:3px;vertical-align:middle}
.pill.rent{background:var(--warn-soft);color:var(--warn)}
.pill.lease{background:#eef2ff;color:#3730a3}
.pill.buy{background:#fff3e0;color:#b45309}
.pill.ev{background:#ecfeff;color:#0e7490}
.pill.no{background:#f1f5f9;color:#6b7280}
.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}.hl{font-weight:800}
.opt{position:relative;cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
.opt .tip{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:#1f2937;color:#fff;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.5;white-space:normal;width:300px;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.opt .tip b{color:#fde68a}
.opt .tip small{color:#cbd5e1}
.opt:hover .tip,.opt:focus .tip{display:block}
a.go{background:#e63946;color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.note{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.6;max-width:110ch}
#detail{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 8px;display:none}
#detail h3{margin:0 0 6px;font-size:14px}
#detail .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px;font-size:12.5px}
#detail .grid div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
#detail .grid span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
#detail .pk{font-size:12px;color:var(--muted);margin-top:6px}
#detail button{float:right;background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12px;padding:2px 8px}
.rank{color:#94a3b8;font-weight:700}
</style>
</head>

const NOWM=DATA.nowm, MODELS=DATA.models, ROWS=DATA.rows;
// rows: [id,mk,g,mf,m,b,y,km,fu,st,lt,fee,n,acq,su,matFlag,rv,rp,dep,tax,pk,grade,loc]
const fuelClass=f=>{f=f||'';if(f.includes('전기')&&f.includes('가솔린'))return'HEV';if(f.includes('디젤')&&f.includes('전기'))return'DHEV';if(f==='전기')return'EV';if(f.includes('가솔린'))return'가솔린';if(f.includes('디젤'))return'디젤';if(f.includes('LPG'))return'LPG';return'기타'};
const nb=b=>(b||'').replace(/\(\s*특장업체\s*\)/g,'').replace(/\s+/g,' ').trim()||'기타';
function predict(g,m,fu,b,age,km){const M=MODELS[g];if(!M)return null;const lv=M.levels;const mm=lv.m.includes(m)?m:(lv.m.find(x=>m&&m.startsWith(x))||lv.m[0]);const ff=lv.fu.includes(fu)?fu:lv.fu[0];const bb=lv.b.includes(b)?b:(lv.b.includes('기타')?'기타':lv.b[0]);
 const v=[1,age,km/1e4,(km/1e4)**2];for(const k of ['m','fu','b'])for(const l of lv[k].slice(1))v.push(({m:mm,fu:ff,b:bb})[k]===l?1:0);
 let s=0;for(let i=0;i<v.length;i++)s+=v[i]*M.beta[i];return{p:Math.exp(s),exact:lv.b.includes(b)&&lv.m.includes(m)}}
const $=id=>document.getElementById(id);
const P=()=>({kmy:+$('kmy').value||24000,hair:(+$('hair').value||0)/100,rhair:(+$('rhair').value||0)/100,ins:+$('ins').value||0,pkr:(+$('pkr').value||0)/100,taxr:(+$('taxr').value||0)/100});
function calc(r,p){const [id,mk,g,mf,m,b,y,km,fu,st,lt,fee,n,acq,su,mf2,rv,rp,dep,tax,pk,grade,loc]=r;
 const buy=lt==='금융리스'?1:0; const mat=buy?(rp||0):(rv||0); const pr0x=predict(g,m,fuelClass(fu),nb(b),Math.max(0,NOWM-(Math.floor(y/100)*12+y%100)),km); const susp=!(mat>1)||(pr0x&&mat<pr0x.p*0.08); const canBuy=((mf2||'').includes('구매')||(buy&&mat>0))&&!susp;
 const age0=Math.max(0,NOWM-(Math.floor(y/100)*12+y%100)); const kme=Math.round(km+p.kmy*n/12);
 const pr=predict(g,m,fuelClass(fu),nb(b),age0+n,kme); const pr0=predict(g,m,fuelClass(fu),nb(b),age0,km);
 const pkg=(pk||[]).reduce((s,x)=>s+(+x[1]||0),0); const pend=pr?pr.p+p.pkr*pkg:null;
 const sell=pend!=null?Math.round(pend*(1-p.hair)*(st==='렌트'?(1-p.rhair):1)):null;
 const taxv=Math.round(mat*p.taxr); const cash0=acq-su; const total=fee*n+cash0+mat+taxv;
 const net=sell!=null?total-sell:null; const insM=(tax||'').includes('보험')?0:p.ins;
 return{id,mk,g,susp,fav:FAV.has(String(id))?1:0,car:mf+' '+m+' '+b,y,km,kme,fee,n,cash0,acq,su,mat,buy,canBuy,st,lt,pend:pend!=null?Math.round(pend):null,pend0:pr0?Math.round(pr0.p):null,sell,margin:sell!=null&&mat>0?sell-mat:null,total,holdm:+(total/n).toFixed(1),net,netm:net!=null?+(net/n).toFixed(1):null,netmi:net!=null?+(net/n+insM).toFixed(1):null,insM,pk:pk||[],pkn:(pk||[]).length,pkg,taxv,tax:tax||'',grade,loc,ev:fuelClass(fu)==='EV',exact:pr?pr.exact:false,rmse:MODELS[g]?MODELS[g].rmse:null}}
let sortK='netm',sortD=1,selId=null;
const FAV=(()=>{try{return new Set(JSON.parse(localStorage.getItem('encar_calc_fav')||'[]').map(String))}catch(e){return new Set()}})();
function saveFav(){try{localStorage.setItem('encar_calc_fav',JSON.stringify([...FAV]))}catch(e){}}
function toggleFav(id){id=String(id);if(FAV.has(id))FAV.delete(id);else FAV.add(id);saveFav();render();}
const f1=v=>v==null?'-':Math.round(v).toLocaleString();
const f2=v=>v==null?'-':(+v).toFixed(1);
function render(){const p=P();const g=$('grp').value;const q=$('q').value.trim().toLowerCase();
 let rows=ROWS.filter(r=>(g==='all'||r[2]===g)).map(r=>calc(r,p));
 if($('buyOnly').checked)rows=rows.filter(r=>r.canBuy&&r.mat>1);
 if($('n12').checked)rows=rows.filter(r=>r.n>=12);
 if($('km80').checked)rows=rows.filter(r=>r.km<=80000);
 if($('evx').checked)rows=rows.filter(r=>!r.ev);
 if($('posOnly').checked)rows=rows.filter(r=>r.margin!=null&&r.margin>0);
 if($('favOnly').checked)rows=rows.filter(r=>r.fav);
 if(q)rows=rows.filter(r=>r.car.toLowerCase().includes(q)||r.id.includes(q));
 rows.sort((a,b)=>{if(sortK==='fav'){if(a.fav!==b.fav)return (b.fav-a.fav)*sortD;return (a.netm??1e9)-(b.netm??1e9);}const x=a[sortK],y=b[sortK];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return typeof x==='string'?x.localeCompare(y)*sortD:(x-y)*sortD});
 $('cnt').innerHTML=`<b>${rows.length}</b>대 표시 · 전체 후보 ${ROWS.length}대`;
 $('favCnt').textContent=FAV.size?'('+FAV.size+')':'';
 const tb=$('tb');tb.innerHTML='';
 rows.slice(0,600).forEach((r,i)=>{const tr=document.createElement('tr');tr.className=(i<3?'r'+(i+1):'')+(r.id===selId?' sel':'')+(r.fav?' fav':'');tr.dataset.id=r.id;
  const pills=`<span class="pill ${r.st==='렌트'?'rent':'lease'}">${r.lt||r.st}</span>${r.buy?'<span class="pill buy">구매필수</span>':''}${!r.canBuy?(r.susp?'<span class="pill no" title="만기구매가가 없거나 비정상적으로 낮음">구매가 미확인</span>':'<span class="pill no">반납만</span>'):''}${r.ev?'<span class="pill ev">⚡EV</span>':''}`;
  const tip=r.pkn?`<b>선택 패키지 ${r.pkn}개 · 합계 ${f1(r.pkg)}만원</b><br>${r.pk.map(x=>`· ${x[0]} <small>${x[1]?x[1]+'만':''}</small>`).join('<br>')}`:'<b>등록된 선택 패키지 없음</b><br><small>트림 기본 사양만</small>';
  tr.innerHTML=`<td class="rank">${i+1}</td><td><button class="fav${r.fav?' on':''}" data-fav="${r.id}" title="즐겨찾기">${r.fav?'★':'☆'}</button></td><td class="l car">${r.car}${pills}<br><small style="color:#6b7280">${r.grade||''}${r.loc?' · '+r.loc:''}${r.exact?'':' · <span title="세부 트림 매칭 안 됨(차종 평균으로 추정)">시세≈</span>'}</small></td><td>${String(r.y).slice(2,4)}/${String(r.y).slice(4,6)}</td><td>${f1(r.km)}</td><td>${f1(r.kme)}</td><td class="hl">${f1(r.fee)}</td><td>${r.n}</td><td class="${r.cash0<0?'good':''}">${r.cash0<0?'−'+f1(-r.cash0)+' 받음':f1(r.cash0)}</td><td>${f1(r.mat)}</td><td>${f1(r.pend)}</td><td>${f1(r.sell)}</td><td class="${r.margin==null?'':r.margin>=0?'good':'bad'}">${r.margin==null?'-':(r.margin>=0?'+':'−')+f1(Math.abs(r.margin))}</td><td>${f1(r.total)}</td><td>${f2(r.holdm)}</td><td class="hl">${f2(r.netm)}</td><td class="hl">${f2(r.netmi)}${r.insM?'<small style="color:#6b7280"> (+보험'+r.insM+')</small>':''}</td><td><span class="opt" tabindex="0">${r.pkn}개 · ${f1(r.pkg)}<span class="tip">${tip}</span></span></td><td><a class="go" href="https://fem.encar.com/cars/detail/${r.id}" target="_blank" rel="noopener">엔카</a></td>`;
  tr.addEventListener('click',e=>{const fb=e.target.closest('button.fav');if(fb){e.stopPropagation();toggleFav(fb.dataset.fav);return;}if(e.target.closest('a,.opt'))return;selId=r.id;showDetail(r);render();});
  tb.appendChild(tr);});
